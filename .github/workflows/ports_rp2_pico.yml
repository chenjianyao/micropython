name: Build RPI_PICO Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: '1.29.0.smile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'micropython repo'  # test build with space in path
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.version }}
        path: 'micropython repo'
    - name: Install packages
      run: tools/ci.sh rp2_setup
    - name: Build
      run: tools/ci.sh rp2_build
    - name: Convert ELF to UF2 with picotool
      run: |
        cd ports/rp2/build-RPI_PICO
        picotool uf2 convert firmware.elf RPI_PICO-v1.29.0.smile.uf2 --family rp2040
        # 如果自动检测失败，可改用下行命令显式指定 family
        # picotool uf2 convert firmware.elf firmware.uf2 --family rp2040
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RPI_PICO-${{ github.event.inputs.version }}
        path: ports/rp2/build-RPI_PICO/RPI_PICO-v1.29.0.smile.uf2