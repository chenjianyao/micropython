name: Build RPI_PICO Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: '1.29.0.smile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'micropython repo'  # test build with space in path
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.version }}
        path: 'micropython repo'
    - name: Install packages
      run: tools/ci.sh rp2_setup
    - name: Build
      run: tools/ci.sh rp2_build
    - name: Rename UF2
      run: |
        cd ports/rp2/build-RPI_PICO
        DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
        UF2_NAME="RPI_PICO_${DATE}-v1.29.0.uf2"
        echo "UF2_NAME=${UF2_NAME}" >> "$GITHUB_ENV"
        ls -la
        cp firmware.uf2 "${UF2_NAME}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.UF2_NAME }}
        path: ${{ github.workspace }}/micropython repo/ports/rp2/build-RPI_PICO/${{ env.UF2_NAME }}